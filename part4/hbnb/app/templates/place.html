{% extends "base.html" %}

{% block title %}Place Details - Holberton BnB{% endblock %}

{% block content %}
<div class="place-details" id="placeDetails">
    <!-- JS populates: name, host, price, description, amenities -->
</div>

<h2>Reviews</h2>
<div id="reviews" class="reviews-container">
    <!-- JS populates review cards -->
</div>

{% if current_user is defined and current_user.is_authenticated %}
<div class="add-review">
    <h3>Add a Review</h3>
    <form id="reviewForm" class="review-form">
        <label for="review-text">Review:</label>
        <textarea id="review-text" required></textarea>

        <label for="rating">Rating (1-5):</label>
        <input type="number" id="rating" min="1" max="5" required>

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</div>
{% endif %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/place.js') }}"></script>
{% endblock %}
