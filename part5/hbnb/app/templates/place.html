{% extends "base.html" %}

{% block title %}Holberton BnB - Place Details{% endblock %}

{% block content %}
<!-- Login link (shown only if user is not authenticated) -->
<a id="login-link" href="/login" style="display: none;">Login</a>

<div class="place-container">
    <h1 id="place-name">Place Name</h1>

    <div id="place-details">
        <!-- Place details will be dynamically inserted via JS -->
    </div>

    <!-- Add Review Section (shown only if user is authenticated) -->
    <div id="add-review" style="display: none;">
        <h2>Add a Review</h2>
        <form id="review-form">
            <label for="review-text">Your Review:</label><br>
            <textarea id="review-text" name="review-text" rows="4" cols="50"></textarea><br>
            <button type="submit">Submit Review</button>
        </form>
        <div id="review-error" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- Reviews List -->
    <div id="reviews-list">
        <h2>Reviews</h2>
        <!-- Reviews will be dynamically inserted via JS -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/places.js') }}"></script>
{% endblock %}
